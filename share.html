<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>idle.beer share image</title>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Dev only: the picture that goes with a shared link. Screenshot it at 1200x630 (or 1200x1200). */
      html, body { margin: 0; height: 100%; background: #120b08; overflow: hidden; }
      #scene { position: absolute; inset: 0; }
      #scene .art, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, transparent 30%, rgba(8, 4, 3, 0.5)); }
      .board {
        position: absolute; right: 5.2vw; top: 50%; transform: translateY(-50%); width: 40vw; box-sizing: border-box;
        padding: 5.4vh 3vw 5.8vh; text-align: center; color: #f3efe4; border-radius: 0.5vw;
        background:
          radial-gradient(ellipse at 18% 0%, rgba(255, 255, 255, 0.07), transparent 52%),
          radial-gradient(ellipse at 92% 100%, rgba(255, 255, 255, 0.04), transparent 46%),
          linear-gradient(#232c29, #1a211f);
        box-shadow: 0 0 0 0.1vw #0c0805, 0 0 0 0.24vw #8f6235, 0 0 0 0.95vw #63401f, 0 0 0 1.05vw #2a180b,
          inset 0 0 6vw rgba(0, 0, 0, 0.45), 0 3vw 6vw rgba(0, 0, 0, 0.65);
      }
      .board h1 { margin: 0; font: 400 7.7vw/0.95 'Abril Fatface', Georgia, serif; letter-spacing: -0.01em; }
      .board h1 span { color: #f7d774; }
      .board .tag {
        margin: 2.6vh 0 0; padding-top: 2.6vh; border-top: 0.16vw solid rgba(243, 239, 228, 0.16);
        font: 700 2.35vw/1.2 'Baloo 2', system-ui, sans-serif;
      }
      .board .sub { margin: 1.6vh 0 0; font: 600 1.5vw/1.3 'Baloo 2', system-ui, sans-serif; color: rgba(243, 239, 228, 0.66); }
      .board .cta {
        display: inline-block; margin-top: 3.4vh; padding: 1.3vh 2.4vw; border-radius: 99vw; color: #2a1608;
        font: 800 1.8vw/1 'Baloo 2', system-ui, sans-serif; background: linear-gradient(#ffe08a, #e2a83e);
        box-shadow: 0 0.4vw 0 #8a5a16, 0 1vw 2vw rgba(0, 0, 0, 0.45);
      }
      /* Square (and taller): the board goes across the top, the bar underneath. */
      @media (max-aspect-ratio: 5 / 4) {
        .shade { background: linear-gradient(transparent 55%, rgba(8, 4, 3, 0.6)); }
        .board { right: auto; left: 50%; top: auto; bottom: 4.5vh; transform: translateX(-50%); width: 82vw; padding: 2.6vh 5vw 3vh; }
        .board h1 { font-size: 15vw; }
        .board .tag { font-size: 4.4vw; margin-top: 1.4vh; padding-top: 1.4vh; }
        .board .sub { display: none; }
        .board .cta { font-size: 3.2vw; margin-top: 1.8vh; padding: 1vh 4.4vw; }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="shade"></div>
    <div class="board">
      <h1>idle<span>.</span>beer</h1>
      <p class="tag">The pub that never calls time</p>
      <p class="sub">Hold to drink. Buy a round. See where it goes.</p>
      <span class="cta">Play free in your browser</span>
    </div>
    <script type="module" src="/src/dev/share.ts"></script>
  </body>
</html>
