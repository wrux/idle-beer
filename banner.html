<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>idle.beer banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #120b08; overflow: hidden; }
      #scene { position: absolute; inset: 0; }
      #scene .art, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .title {
        position: absolute; left: 0; right: 0; top: 0; padding: 4.5vh 5vw 14vh;
        background: linear-gradient(rgba(8, 4, 3, 0.82), rgba(8, 4, 3, 0.45) 55%, transparent);
        font-family: 'Abril Fatface', Georgia, serif; color: #fbe9c4;
      }
      .title h1 {
        margin: 0; font-weight: 400; font-size: 15vh; line-height: 1;
        background: linear-gradient(#ffe9a6, #f6c651 55%, #e39a2c); -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; filter: drop-shadow(0 0.5vh 0 rgba(60, 24, 4, 0.9)) drop-shadow(0 1vh 3vh rgba(0, 0, 0, 0.6));
      }
      .title p { margin: 1.2vh 0 0; font: 600 4.4vh 'Baloo 2', system-ui, sans-serif; color: #f8eeda; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      .title[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="title" id="title">
      <h1>idle.beer</h1>
      <p>A UK pub incremental game. Hold to drink.</p>
    </div>
    <script type="module" src="/src/dev/banner.ts"></script>
  </body>
</html>
