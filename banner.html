<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>idle.beer banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #120b08; overflow: hidden; }
      #scene { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
      #scene .art, #scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* The name, lettered on a board along the front of the bar, where nobody's face is. */
      html:not(.plain) #scene { top: -7vh; bottom: 0; }
      .shade { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 85% at 50% 42%, transparent 55%, rgba(8, 4, 3, 0.55)); }
      .board {
        position: absolute; left: 2.2vw; right: 2.2vw; bottom: 3.6vh; height: 20vh; box-sizing: border-box;
        display: flex; align-items: center; gap: 2.2vw; padding: 0 2.6vw 0.4vh; color: #f3efe4; border-radius: 0.4vw;
        background:
          radial-gradient(ellipse at 12% 0%, rgba(255, 255, 255, 0.08), transparent 45%),
          radial-gradient(ellipse at 92% 100%, rgba(255, 255, 255, 0.04), transparent 40%),
          linear-gradient(#232c29, #1a211f);
        box-shadow: 0 0 0 0.08vw #0c0805, 0 0 0 0.2vw #8f6235, 0 0 0 0.7vw #63401f, 0 0 0 0.78vw #2a180b,
          inset 0 0 5vw rgba(0, 0, 0, 0.45), 0 1.6vw 3vw rgba(0, 0, 0, 0.6);
      }
      .board h1 { margin: 0; font: 400 15vh/1 'Abril Fatface', Georgia, serif; letter-spacing: -0.01em; }
      .board h1 span { color: #f7d774; }
      .board .words { flex: 1; white-space: nowrap; padding-left: 2.2vw; border-left: 0.14vw solid rgba(243, 239, 228, 0.18); }
      .board .tag { margin: 0; font: 700 4.5vh/1.15 'Baloo 2', system-ui, sans-serif; }
      .board .sub { margin: 0.6vh 0 0; font: 600 2.9vh/1.2 'Baloo 2', system-ui, sans-serif; color: rgba(243, 239, 228, 0.66); }
      .board .cta {
        padding: 2vh 1.8vw; border-radius: 99vw; color: #2a1608; white-space: nowrap;
        font: 800 3.3vh/1 'Baloo 2', system-ui, sans-serif; background: linear-gradient(#ffe08a, #e2a83e);
        box-shadow: 0 0.7vh 0 #8a5a16, 0 1.6vh 3vh rgba(0, 0, 0, 0.45);
      }
      .plain .board, .plain .shade { display: none; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="shade"></div>
    <div class="board">
      <h1>idle<span>.</span>beer</h1>
      <div class="words">
        <p class="tag">The pub that never calls time</p>
        <p class="sub">Hold to drink. Buy a round. See where it goes.</p>
      </div>
      <span class="cta">Play free in your browser</span>
    </div>
    <script type="module" src="/src/dev/banner.ts"></script>
  </body>
</html>
